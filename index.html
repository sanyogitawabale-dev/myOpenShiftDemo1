
<!DOCTYPE html>
<html lang="en">
<head>

    <title>OpenShift Workshop</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;

            background: linear-gradient(135deg, #c31432, #7b1024);
            color: white;

        .container {
